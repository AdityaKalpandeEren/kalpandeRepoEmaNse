name: NSE Alert Scan

on:
  schedule:
    # 09:15–09:55 IST
    - cron: "15-55/5 9 * * 1-5"
      timezone: "Asia/Kolkata"

    # 10:00–14:55 IST
    - cron: "*/5 10-14 * * 1-5"
      timezone: "Asia/Kolkata"

    # 15:00–15:30 IST
    - cron: "0-30/5 15 * * 1-5"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

# One scan at a time: the research paper-trading state (live_state/) is
# read at the start of a run and written at the end, so overlapping runs
# would lose each other's trades. A trigger that arrives mid-run waits; the
# next run catches up on every candle closed since the last one.
concurrency:
  group: nse-alert-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Paper-trading state + L_ML_META_V2's market-data cache survive
      # between runs: restore the newest, save a new one at the end (a cache
      # key can't be overwritten, hence the per-run key).
      - name: Restore paper-trading state
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: nse-live-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-live-state-

      - run: python scan_once.py
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: a separate chat for research/paper alerts + EOD report.
          LIVE_RESEARCH_CHAT_ID: ${{ secrets.LIVE_RESEARCH_CHAT_ID }}
          # Optional: enables V3's Claude catalyst reader (rules otherwise).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save paper-trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: nse-live-state-${{ github.run_id }}-${{ github.run_attempt }}

      # The day's report + all-time trade log as a downloadable artifact -
      # only on after-close runs, not every 5-minute scan.
      - name: Check IST time
        id: ist
        if: always()
        run: echo "hhmm=$(TZ=Asia/Kolkata date +%H%M)" >> "$GITHUB_OUTPUT"

      - name: Upload paper-trading reports
        if: always() && steps.ist.outputs.hhmm >= 1530
        uses: actions/upload-artifact@v4
        with:
          name: nse-paper-trading-${{ github.run_id }}
          path: |
            live_state/reports
            live_state/paper_trades_all.csv
          if-no-files-found: ignore
          retention-days: 30