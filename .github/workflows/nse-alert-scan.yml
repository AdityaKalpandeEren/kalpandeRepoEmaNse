name: NSE Alert Scan

on:
  schedule:
    # 09:15–09:55 IST
    - cron: "15-55/5 9 * * 1-5"
      timezone: "Asia/Kolkata"

    # 10:00–14:55 IST
    - cron: "*/5 10-14 * * 1-5"
      timezone: "Asia/Kolkata"

    # 15:00–15:30 IST
    - cron: "0-30/5 15 * * 1-5"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

# Concurrency is per JOB (not per workflow run), so the V3.3 job's slow
# 9:45 pick never holds up the 2-minute scans.

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write      # prune old caches (step below)
    timeout-minutes: 10
    # One scan at a time: the research paper-trading state (live_state/) is
    # read at the start of a run and written at the end, so overlapping runs
    # would lose each other's trades. A trigger that arrives mid-run waits;
    # the next run catches up on every candle closed since the last one.
    concurrency:
      group: nse-alert-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Paper-trading state + L_ML_META_V2's market-data cache survive
      # between runs: restore the newest, save a new one at the end (a cache
      # key can't be overwritten, hence the per-run key).
      - name: Restore paper-trading state
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: nse-live-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-live-state-

      - run: python scan_once.py
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: a separate chat for research/paper alerts + EOD report.
          LIVE_RESEARCH_CHAT_ID: ${{ secrets.LIVE_RESEARCH_CHAT_ID }}
          # Gemini (free tier) reads the news for V2 and V3; without it they
          # fall back to the keyword lexicon / sector rules.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Production EMA-cross / VWAP alerts: paused by default. Set the
          # repo variable PRODUCTION_ALERTS_ENABLED=true to resume them.
          PRODUCTION_ALERTS_ENABLED: ${{ vars.PRODUCTION_ALERTS_ENABLED || 'false' }}

      - name: Save paper-trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: nse-live-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Each run saves a new nse-live-state-<run_id> cache (~2 MB) and only the newest
      # is ever restored. ~5,000 stale copies pushed the repo past GitHub's
      # 10 GB cache limit (2026-10-06), so GitHub was evicting caches - which
      # can include the model / data-store caches of the other jobs. Keep the
      # newest 30; delete at most 40 per run (the backlog clears in a few hours).
      - name: Prune old paper-trading caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key nse-live-state- --sort created_at --order desc --limit 300 \
            --json id,key --jq '.[] | select(.key | startswith("nse-live-state-")) | .id' \
            | tail -n +31 | head -n 40 | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      # The day's report + all-time trade log as a downloadable artifact -
      # only on after-close runs, not every 5-minute scan.
      - name: Check IST time
        id: ist
        if: always()
        run: echo "hhmm=$(TZ=Asia/Kolkata date +%H%M)" >> "$GITHUB_OUTPUT"

      - name: Upload paper-trading reports
        if: always() && steps.ist.outputs.hhmm >= 1530
        uses: actions/upload-artifact@v4
        with:
          name: nse-paper-trading-${{ github.run_id }}
          path: |
            live_state/reports
            live_state/paper_trades_all.csv
          if-no-files-found: ignore
          retention-days: 30

  # V3.3 daily ranker (live_v33.py), on the same trigger as the scan. Each
  # run does one step of the day and exits: before 9:45 nothing; first run
  # after 9:45 scores ~260 stocks and sends the top-5 picks (a few minutes);
  # then 2% stop checks; first run after 15:15 squares off + day report.
  v33:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One V3.3 step at a time; while the pick runs, later triggers queue
    # (GitHub keeps only the newest waiting one and cancels older waiting ones).
    concurrency:
      group: nse-v33
      cancel-in-progress: false

    steps:
      - name: Trading window check (Mon-Fri 9:40-15:45 IST)
        id: win
        run: |
          hhmm=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          if [ "$dow" -le 5 ] && [ "$hhmm" -ge 0940 ] && [ "$hhmm" -le 1545 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the V3.3 window ($hhmm IST) - nothing to do"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.win.outputs.run == 'true'
        run: pip install -r requirements.txt

      # V3.3 state + its history / NSE-archive / earnings caches (own key
      # prefix: never mixes with the scan's nse-live-state- cache).
      - name: Restore V3.3 state + data cache
        if: steps.win.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/v33
            backtest/cache
            backtest/ml/cache
          key: nse-v33-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-v33-

      - name: Run V3.3 step
        id: v33
        if: steps.win.outputs.run == 'true'
        timeout-minutes: 50
        run: python live_v33.py
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_RESEARCH_CHAT_ID: ${{ secrets.LIVE_RESEARCH_CHAT_ID }}

      # Save only when the step changed something (pick / stop / close), not
      # on every 2-minute check.
      - name: Save V3.3 state + data cache
        if: always() && steps.win.outputs.run == 'true' && steps.v33.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/v33
            backtest/cache
            backtest/ml/cache
          key: nse-v33-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload V3.3 trades
        if: always() && steps.win.outputs.run == 'true' && steps.v33.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nse-v33-${{ github.run_id }}
          path: live_state/v33
          if-no-files-found: ignore
          retention-days: 30

  # V5.0 swing model (v5/live.py): once per trading day, on the first
  # trigger after 09:20 IST - downloads the previous session's NSE files,
  # scores ~100 large caps from that close, and every 5th session rebalances
  # the paper portfolio (top 20) at today's open. Telegram: rebalance orders
  # or a daily portfolio update. Later triggers the same day exit at once.
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nse-v5
      cancel-in-progress: false

    steps:
      - name: Trading window check (Mon-Fri 9:20-15:30 IST)
        id: win
        run: |
          hhmm=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          if [ "$dow" -le 5 ] && [ "$hhmm" -ge 0920 ] && [ "$hhmm" -le 1530 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the V5 window ($hhmm IST) - nothing to do"
          fi

      # The day's work is done after the first successful run: a tiny marker
      # cache (one key per IST date) lets later triggers skip the heavy setup.
      - name: Already done today?
        id: done
        if: steps.win.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .v5_done
          key: nse-v5-done-${{ github.run_id }}
          restore-keys: |
            nse-v5-done-

      - name: Check marker date
        id: today
        if: steps.win.outputs.run == 'true'
        run: |
          d=$(TZ=Asia/Kolkata date +%F)
          if [ -f .v5_done ] && [ "$(cat .v5_done)" = "$d" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "V5 already ran today ($d)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        run: pip install -r requirements.txt -r v5/requirements-live.txt

      - name: Restore V5 state + NSE data cache
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/v5
            swing/cache
          key: nse-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-v5-

      - name: Run V5 step
        id: v5
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        timeout-minutes: 40
        run: python -m v5.live
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_RESEARCH_CHAT_ID: ${{ secrets.LIVE_RESEARCH_CHAT_ID }}

      - name: Save V5 state + NSE data cache
        if: always() && steps.win.outputs.run == 'true' && steps.v5.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/v5
            swing/cache
          key: nse-v5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark today done
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true' && steps.v5.outcome == 'success' && hashFiles('live_state/v5/state.json') != ''
        run: |
          d=$(TZ=Asia/Kolkata date +%F)
          if python -c "import json,sys; sys.exit(0 if json.load(open('live_state/v5/state.json')).get('last_day')=='$d' else 1)"; then
            echo "$d" > .v5_done; echo "marked $d"
          fi

      - name: Save done marker
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true' && hashFiles('.v5_done') != ''
        uses: actions/cache/save@v4
        with:
          path: .v5_done
          key: nse-v5-done-${{ github.run_id }}

      - name: Upload V5 trades
        if: always() && steps.win.outputs.run == 'true' && steps.v5.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nse-v5-${{ github.run_id }}
          path: live_state/v5
          if-no-files-found: ignore
          retention-days: 30

