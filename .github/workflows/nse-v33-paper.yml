name: NSE V3.3 Warm Cache

# V3.3 paper trading itself runs inside "NSE Alert Scan" (job `v33`), on the
# same cron-job.org trigger as the scan. This workflow is manual only: it
# fills V3.3's data caches (years of daily candles, NSE archives, Yahoo
# earnings dates) so the 9:45 pick doesn't have to download them - run it
# once after adding many stocks to the watchlist/universe, or if the
# nse-v33- cache was evicted. It shares the `nse-v33` concurrency group, so
# it never overlaps a live V3.3 step.
on:
  workflow_dispatch:

concurrency:
  group: nse-v33
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore V3.3 state + data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/v33
            backtest/cache
            backtest/ml/cache
          key: nse-v33-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-v33-

      - name: Warm V3.3 caches
        timeout-minutes: 110
        run: python live_v33.py --warm
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

      - name: Save V3.3 state + data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/v33
            backtest/cache
            backtest/ml/cache
          key: nse-v33-${{ github.run_id }}-${{ github.run_attempt }}
